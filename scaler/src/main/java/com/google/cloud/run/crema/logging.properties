.level = INFO

# Mute the info logging from Kafka
org.apache.kafka.level=WARNING

handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = com.google.cloud.run.crema.CremaLogFormatter
java.util.logging.SimpleFormatter.format=[%4$s] [SCALER] %5$s%6$s%n